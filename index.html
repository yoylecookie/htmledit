<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon"
          type="image/png"
          href="https://www.rw-designer.com/icon-image/14290-48x48x32.png">

    <!-- Prism -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.css">

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #editor {
            position: relative;
            width: 50vw;
            height: 100vh;
            overflow: hidden;
        }

        #highlight {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;

            margin: 0;
            padding: 4px;

            font-family: monospace;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.2;

            letter-spacing: normal;
            word-spacing: normal;

            white-space: pre;
            tab-size: 4;

            pointer-events: none;

            background: white;
            color: black;

            z-index: 1;

            transform: translate(0, 0);
        }

        #highlight code {
            display: block;

            margin: 0;
            padding: 0;

            font-family: monospace;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.2;

            white-space: pre;
            background: transparent;
        }

        #input {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 4px;

            font-family: monospace;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.2;

            letter-spacing: normal;
            word-spacing: normal;

            white-space: pre;
            tab-size: 4;

            resize: none;
            overflow: auto;

            background: transparent;

            color: transparent;
            -webkit-text-fill-color: transparent;

            caret-color: black;

            outline: none;

            z-index: 2;
        }

        #preview {
            width: 50vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="container">

    <div id="editor">

        <pre id="highlight"><code></code></pre>

        <textarea
            id="input"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
        ></textarea>

    </div>

    <iframe id="preview"></iframe>

</div>

<script>
const input = document.getElementById("input");
const highlight = document.getElementById("highlight");
const highlightCode = document.querySelector("#highlight code");
const preview = document.getElementById("preview");

const STORAGE_KEY = "html-editor-code";

const defaultCode = `<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>Page Title</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
    body {
        
    }
</style>

<body>

<script>
<\/script>

</body>
</html>`;


/*
    Load saved code
*/

const savedCode = localStorage.getItem(STORAGE_KEY);

if (savedCode !== null) {
    input.value = savedCode;
} else {
    input.value = defaultCode;
}


/*
    Update highlighting, preview,
    and scrolling.
*/

function update() {

    const code = input.value;

    /*
        Save
    */

    localStorage.setItem(STORAGE_KEY, code);


    /*
        Highlight
    */

    highlightCode.innerHTML = Prism.highlight(
        code,
        Prism.languages.markup,
        "markup"
    );


    /*
        Preview
    */

    preview.srcdoc = code;


    /*
        Move highlighting exactly
        opposite the textarea's scroll.
    */

    highlight.style.transform =
        `translate(${-input.scrollLeft}px, ${-input.scrollTop}px)`;
}


/*
    Typing
*/

input.addEventListener("input", update);


/*
    Scrolling
*/

input.addEventListener("scroll", () => {

    highlight.style.transform =
        `translate(${-input.scrollLeft}px, ${-input.scrollTop}px)`;

});


/*
    Initial update
*/

update();
</script>

</body>
</html>
